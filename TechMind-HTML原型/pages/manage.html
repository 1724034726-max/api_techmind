<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文章管理 · TechMind</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="app-top">
    <div class="app-top-inner">
      <a class="logo" href="home.html">Tech<span>Mind</span></a>
      <nav class="nav">
        <a href="home.html">首页</a>
        <a href="search.html">语义搜索</a>
        <a href="editor.html">写文章</a>
        <a href="favorites.html">收藏</a>
        <a href="profile.html">我的</a>
      </nav>
      <div class="top-actions" data-auth-actions></div>
    </div>
  </header>

  <main class="page">
    <div class="eyebrow">Content</div>
    <div class="section-head">
      <div>
        <h1 style="max-width:none;font-size:2.2rem;margin:0 0 8px">文章管理</h1>
        <p class="lede" style="margin:0">草稿 / 已发布 · 编辑删除 · 版本历史</p>
      </div>
      <a class="btn btn-primary" href="editor.html">写新文章</a>
    </div>

    <div id="manageGuest" class="settings-empty hidden">
      请先 <a href="login.html">登录</a> 后管理文章。
    </div>

    <div id="manageAuthed" class="hidden">
      <div class="feed-tabs" id="manageTabs">
        <button type="button" class="on" data-manage-tab="all">全部</button>
        <button type="button" data-manage-tab="published">已发布</button>
        <button type="button" data-manage-tab="draft">草稿</button>
      </div>
      <div class="manage-list" id="manageList"></div>
    </div>
  </main>

  <div class="drawer-mask hidden" id="versionMask"></div>
  <aside class="drawer hidden" id="versionDrawer">
    <div class="drawer-head">
      <h2>版本历史</h2>
      <button class="btn btn-ghost" type="button" id="closeVersion">关闭</button>
    </div>
    <div class="drawer-body" id="versionBody"></div>
  </aside>

  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
