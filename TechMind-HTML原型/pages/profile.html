<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人主页 · TechMind</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="app-top">
    <div class="app-top-inner">
      <a class="logo" href="home.html">Tech<span>Mind</span></a>
      <nav class="nav">
        <a href="home.html">首页</a>
        <a href="search.html">语义搜索</a>
        <a href="editor.html">写文章</a>
        <a href="favorites.html">收藏</a>
        <a class="active" href="profile.html">我的</a>
      </nav>
      <div class="top-actions" data-auth-actions></div>
    </div>
  </header>

  <main class="page">
    <div id="profileGuest" class="settings-empty hidden">
      <div class="eyebrow">Profile</div>
      <h1 style="max-width:none">登录后查看个人主页</h1>
      <p class="lede">展示你的资料、兴趣与已发布的文章。</p>
      <div class="chip-row">
        <a class="btn btn-primary" href="register.html">注册</a>
        <a class="btn" href="login.html">登录</a>
      </div>
    </div>

    <div id="profileAuthed" class="hidden">
      <section class="profile-head">
        <div class="big-avatar" id="profileAvatar">?</div>
        <div>
          <div class="profile-title-row">
            <h1 id="profileName" style="margin-bottom:0;max-width:none;font-size:2.2rem">—</h1>
            <span class="role-badge" id="profileRole">读者</span>
          </div>
          <p class="lede" id="profileBio" style="margin:10px 0 12px">—</p>
          <div class="profile-tags" id="profileTags"></div>
          <div class="profile-stats">
            <span><b id="statArticles">0</b> 文章</span>
            <span><b id="statFollowers">0</b> 粉丝</span>
            <span><b id="statFollowing">0</b> 关注</span>
            <span><b id="statFavs">0</b> 收藏</span>
          </div>
          <div class="chip-row" style="margin-top:16px">
            <a class="btn btn-primary" href="settings.html">编辑资料</a>
            <a class="btn" href="manage.html">文章管理</a>
            <a class="btn" href="editor.html">写文章</a>
            <a class="btn" href="favorites.html">我的收藏</a>
          </div>
          <div class="profile-more">
            <span class="profile-more-label">更多</span>
            <a href="topic.html">热点专题</a>
            <a href="admin.html">运营台</a>
            <a href="column.html">我的专栏</a>
          </div>
        </div>
      </section>

      <a class="profile-graph-card" href="graph.html">
        <div class="profile-graph-copy">
          <div class="eyebrow">Knowledge Graph</div>
          <h2>我的知识图谱</h2>
          <p>把收藏与阅读过的技术概念连成网络，发现文章之间的关联。</p>
          <span class="profile-graph-cta">进入图谱 →</span>
        </div>
        <div class="profile-graph-visual" aria-hidden="true">
          <span class="hf-node core">缓存穿透</span>
          <span class="hf-node n1">布隆过滤</span>
          <span class="hf-node n2">空值缓存</span>
          <span class="hf-node n3">Redis</span>
        </div>
      </a>

      <div class="section-head">
        <div>
          <h2>我的文章</h2>
          <p>按发布时间排序</p>
        </div>
        <a class="btn btn-ghost" href="editor.html">去写作 →</a>
      </div>
      <div class="feed" id="myArticleFeed"></div>
    </div>
  </main>

  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
